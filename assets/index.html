<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PS2 Style UI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
  color:white;
}

/* Background looping MP4 */
#bgVideo{
  position:fixed;
  top:45%;
  left:30%;
  transform:translate(-50%,-50%);
  width:150vh;
  opacity:0.9;
  pointer-events:none;
}

/* White line */
.bottomLine{
  position:fixed;
  bottom:10vh;
  left:0;
  width:100%;
  height:2px;
  background:white;
  box-shadow:0 0 12px white;
}

/* Bottom-right controls */
.controls{
  position:fixed;
  right:30px;
  bottom:calc(12vh - 75px);

  display:flex;
  gap:75px;

  align-items:flex-start;
}

/* Each button row */
.controlItem{
  display:flex;
  align-items:center;
  gap:12px;

  transition:0.2s;
}

.controlItem:hover{
  transform:translateX(-4px);
}

/* Button image */
.controlItem img{
  width:7vh;

  filter:
    drop-shadow(0 0 5px rgb(0, 0, 0))
    drop-shadow(0 0 12px rgb(104, 104, 104));
}

/* Text */
.controlText{
  font-size:20px;
  color:white;
  text-shadow:
    0 0 6px white,
    0 0 12px white;
}
</style>
</head>

<body>

<!-- Background Video -->
<video
  id="bgVideo"
  autoplay
  muted
  loop
  playsinline
>
  <!-- Replace with your MP4 CDN -->
  <source src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/psps/assets/menu/rings.mp4" type="video/mp4">
</video>

<!-- White line -->
<div class="bottomLine"></div>

<!-- Bottom-right PS2 controls -->
<div class="controls">

  <!-- X -->
  <div class="controlItem">
    <img src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/psps/assets/button/x.png">
    <div class="controlText">Enter</div>
  </div>

  <!-- Circle -->
  <div class="controlItem">
    <img src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/psps/assets/button/circle.png">
    <div class="controlText">Back</div>
  </div>

  <!-- Triangle -->
  <div class="controlItem">
    <img src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/psps/assets/button/triangle.png">
    <div class="controlText">Options</div>
  </div>

</div>

</body>
</html>
